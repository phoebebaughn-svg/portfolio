<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Form</title>

  <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="forms.css">

  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<body>

<header class="top-bar">
  <h1>✧˖° Contact ✧˖°</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="forms.html">Contact</a>
  </nav>
</header>

<main>
  <section class="form-card">

    <h2>Send a Message</h2>

    <form>
      <label for="name">Name</label>
      <input id="name" type="text" placeholder="Your name" required>

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="Your email" required>

      <label for="message">Message</label>
      <textarea id="message" placeholder="Write something..." required></textarea>

      <button type="submit">Send</button>
    </form>

  </section>
</main>

<footer>
  <p>© 2026 My Portfolio</p>
</footer>

</body>
</html>
